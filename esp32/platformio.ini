; Tread Control: ESP32-S3 als eigenes Bluetooth-Funkmodul der Konsole (FTMS und Laufsensor)
; Board: Olimex ESP32-S3-DevKit-Lipo (ESP32-S3-WROOM-1-N8R8), angeschlossen am nativen USB-Anschluss
[env:olimex-s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=4
lib_deps =
  h2zero/NimBLE-Arduino@1.4.3
